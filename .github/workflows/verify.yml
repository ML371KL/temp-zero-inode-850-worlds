name: Проверка источника миров
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 pytest==8.3.3
      - name: Индекс и версии
        run: python -B tools/worlds.py index --check && python -B tools/worlds.py verify
      - name: Тесты
        run: python -m pytest -q -p no:cacheprovider tests
