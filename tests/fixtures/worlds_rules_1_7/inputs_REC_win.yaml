notes:
- key_avg = average key rate in period
- 'ofz_* for N/H = perfect-foresight mean of (key-0.5pp) over tenor + term premium
  decaying from today-implied to steady state (N: 1.4pp, half-life 1.25y; H: 2.5pp,
  half-life 2y); 2026H2 blended 50/50 with observed curve of 18.09.2026'
- ofz_* for M = forward zero yields from MOEX zcyc 18.09.2026 as is; key for M = 6m
  forward OFZ + 0.75pp (0.5pp in steady state)
- cpi for M = OFZ-IN breakevens (CBR-adjusted estimates 5.8/7.7/9.3 and naive 18.09.2026
  forwards 9.8-10.1) smoothed to 9.0
